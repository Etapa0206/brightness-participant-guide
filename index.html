<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>亮度调整实验被试教程</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

    body { margin: 0; background: #f3f7fb; color: #17212b; }
    main { width: min(92vw, 620px); margin: 0 auto; padding: 56px 0; }
    section { background: #fff; border: 1px solid #dbe5ee; border-radius: 20px; padding: 32px 24px; box-shadow: 0 12px 32px rgba(21,94,155,.09); text-align: center; }
    .tag { display: inline-block; padding: 7px 12px; border-radius: 999px; color: #155e9b; background: #eaf3fb; font-size: 14px; }
    h1 { margin: 18px 0 12px; font-size: clamp(28px, 7vw, 40px); line-height: 1.25; }
    p { margin: 10px 0; color: #536273; line-height: 1.75; }
    a { display: block; margin-top: 28px; padding: 15px 18px; border-radius: 12px; background: #155e9b; color: #fff; font-weight: 700; text-decoration: none; }
    small { display: block; margin-top: 18px; color: #718096; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <section>
      <span class="tag">手机阅读版 v1.1</span>
      <h1>亮度调整实验<br>被试操作教程</h1>
      <p>请在实验开始前完整阅读，并按照实验程序页面提示和主试说明操作。</p>
      <a href="participant-guide.pdf">在线阅读 / 下载 PDF</a>
      <small>如页面无法打开，请告知主试。<br>更新日期：2026-09-15</small>

  </main>

</html>
